services:
  # Service Backend
  backend:
    build: ./apps/backend
    container_name: eraser-backend
    ports:
      - "8000:8000"
    volumes:
      - u2net_cache:/root/.u2net

  # Service Frontend
  frontend:
    build: ./apps/frontend
    container_name: eraser-frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend

volumes:
  u2net_cache: